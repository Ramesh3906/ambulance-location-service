services:
  mysql:
    image: mysql:8.4
    container_name: ambulance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ambulance
      MYSQL_USER: ambulance
      MYSQL_PASSWORD: ambulance
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.4
    container_name: ambulance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:
